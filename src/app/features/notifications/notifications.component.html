<app-main-layout>
  <div class="space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-900">Notifications</h1>
      <div class="flex space-x-2">
        <button
          (click)="filterByType('all')"
          [class.bg-primary-600]="selectedType === 'all'"
          [class.text-white]="selectedType === 'all'"
          class="px-3 py-1 rounded-md text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors"
        >
          All
        </button>
        <button
          (click)="filterByType('announcement')"
          [class.bg-primary-600]="selectedType === 'announcement'"
          [class.text-white]="selectedType === 'announcement'"
          class="px-3 py-1 rounded-md text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors"
        >
          Announcements
        </button>
        <button
          (click)="filterByType('meeting')"
          [class.bg-primary-600]="selectedType === 'meeting'"
          [class.text-white]="selectedType === 'meeting'"
          class="px-3 py-1 rounded-md text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors"
        >
          Meetings
        </button>
        <button
          (click)="filterByType('event')"
          [class.bg-primary-600]="selectedType === 'event'"
          [class.text-white]="selectedType === 'event'"
          class="px-3 py-1 rounded-md text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors"
        >
          Events
        </button>
      </div>
    </div>

    <app-loading-spinner *ngIf="isLoading" message="Loading notifications..." />

    <div
      *ngIf="!isLoading && filteredNotifications.length === 0"
      class="text-center py-12"
    >
      <p class="text-gray-500">No notifications found for the selected type.</p>
    </div>

    <div *ngIf="!isLoading" class="space-y-4">
      <div
        *ngFor="let notification of filteredNotifications"
        class="card hover:shadow-lg transition-shadow duration-200"
        [class.bg-blue-50]="!notification.isRead"
        [class.border-l-4]="true"
        [class.border-l-warning-500]="notification.priority === 'high'"
        [class.border-l-primary-500]="notification.priority === 'medium'"
        [class.border-l-gray-300]="notification.priority === 'low'"
      >
        <div class="card-body">
          <div class="flex justify-between items-start mb-3">
            <div class="flex items-start space-x-3">
              <div
                class="w-10 h-10 rounded-lg flex items-center justify-center"
                [class.bg-warning-100]="notification.type === 'meeting'"
                [class.bg-primary-100]="notification.type === 'announcement'"
                [class.bg-secondary-100]="notification.type === 'event'"
                [class.bg-accent-100]="notification.type === 'reminder'"
              >
                <svg
                  class="w-6 h-6"
                  [class.text-warning-600]="notification.type === 'meeting'"
                  [class.text-primary-600]="
                    notification.type === 'announcement'
                  "
                  [class.text-secondary-600]="notification.type === 'event'"
                  [class.text-accent-600]="notification.type === 'reminder'"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    *ngIf="notification.type === 'meeting'"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"
                  />
                  <path
                    *ngIf="notification.type === 'announcement'"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"
                  />
                  <path
                    *ngIf="notification.type === 'event'"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                  />
                  <path
                    *ngIf="notification.type === 'reminder'"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 17h5l-5 5v-5zM11 17H3a2 2 0 01-2-2V8a2 2 0 012-2h8a2 2 0 012 2v9a2 2 0 01-2 2z"
                  />
                </svg>
              </div>
              <div>
                <h3 class="text-lg font-semibold text-gray-900">
                  {{ notification.title }}
                </h3>
                <p class="text-sm text-gray-600">{{ notification.author }}</p>
              </div>
            </div>
            <div class="text-right">
              <div class="flex items-center space-x-2">
                <span
                  class="badge"
                  [class.badge-error]="notification.priority === 'high'"
                  [class.badge-warning]="notification.priority === 'medium'"
                  [class.badge-info]="notification.priority === 'low'"
                >
                  {{ notification.priority | titlecase }} Priority
                </span>
                <span class="badge badge-info">
                  {{ notification.type | titlecase }}
                </span>
              </div>
              <div class="text-xs text-gray-500 mt-1">
                {{ notification.date | date : "MMM d, y" }}
              </div>
              <div *ngIf="!notification.isRead" class="flex items-center mt-1">
                <div class="w-2 h-2 bg-primary-500 rounded-full mr-1"></div>
                <span class="text-xs text-primary-600 font-medium">Unread</span>
              </div>
            </div>
          </div>

          <p class="text-gray-700 leading-relaxed">
            {{ notification.message }}
          </p>

          <div class="mt-4 pt-3 border-t border-gray-200">
            <button
              *ngIf="!notification.isRead"
              (click)="markAsRead(notification.id)"
              class="text-sm text-primary-600 hover:text-primary-800 font-medium"
            >
              Mark as read
            </button>
            <span *ngIf="notification.isRead" class="text-sm text-gray-500">
              ✓ Read
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-main-layout>
