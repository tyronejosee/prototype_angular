<div
  class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8"
>
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">
        Prototype Angular
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Sign in to access your children's school information
      </p>
    </div>
    <div class="card">
      <div class="card-body">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">
              Email address
            </label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              formControlName="email"
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm"
              [class.border-red-300]="
                loginForm.get('email')?.invalid &&
                loginForm.get('email')?.touched
              "
              placeholder="Enter your email"
            />
            <div
              *ngIf="
                loginForm.get('email')?.invalid &&
                loginForm.get('email')?.touched
              "
              class="mt-1 text-sm text-red-600"
            >
              Please enter a valid email address
            </div>
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700"
            >
              Password
            </label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              formControlName="password"
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm"
              [class.border-red-300]="
                loginForm.get('password')?.invalid &&
                loginForm.get('password')?.touched
              "
              placeholder="Enter your password"
            />
            <div
              *ngIf="
                loginForm.get('password')?.invalid &&
                loginForm.get('password')?.touched
              "
              class="mt-1 text-sm text-red-600"
            >
              Password is required
            </div>
          </div>

          <div *ngIf="errorMessage" class="rounded-md bg-red-50 p-4">
            <div class="text-sm text-red-700">
              {{ errorMessage }}
            </div>
          </div>

          <div>
            <button
              type="submit"
              [disabled]="loginForm.invalid || isLoading"
              class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <span
                *ngIf="isLoading"
                class="absolute left-0 inset-y-0 flex items-center pl-3"
              >
                <div
                  class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"
                ></div>
              </span>
              {{ isLoading ? "Signing in..." : "Sign in" }}
            </button>
          </div>
        </form>

        <div class="mt-6 p-4 bg-blue-50 rounded-md">
          <h4 class="text-sm font-medium text-blue-900 mb-2">
            Demo Credentials:
          </h4>
          <p class="text-sm text-blue-700">
            Email: <strong>parent&#64;example.com</strong><br />
            Password: <strong>password123</strong>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
