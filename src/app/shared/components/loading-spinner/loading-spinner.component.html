<div
  class="flex items-center justify-center py-20"
  [class.min-h-64]="fullHeight"
>
  <div class="text-center">
    <div
      class="animate-spin rounded-full border-b-2 border-primary-600 mx-auto mb-4"
      [class]="spinnerSize"
    ></div>
    <p class="text-gray-600" *ngIf="message">{{ message }}</p>
  </div>
</div>
